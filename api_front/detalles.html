<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museo Virtual - Detalles de Obra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Museo Virtual de Arte</h1>
        <nav>
            <a href="index.html">Salas</a>
            <a href="todas_obras.html">Obras</a>
        </nav>
    </header>

    <div class="container">
        <div class="obra-ficha">
            <div class="obra-imagen">
                <img id="imagen-obra" src="" alt="Imagen de la Obra" style="max-width: 100%; height: auto; border-radius: 10px;">
            </div>
            <div class="obra-detalles">
                <h1 id="nombre-obra">Título de la Obra</h1>
                <div class="detalle">
                    <strong>Descripción:</strong>
                    <p id="descripcion-obra">Descripción detallada de la obra.</p>
                </div>
                <div class="detalle">
                    <strong>Sala:</strong>
                    <p id="sala-obra">Nombre de la sala.</p>
                </div>
                <div class="detalle">
                    <strong>Autor:</strong>
                    <p id="autor-obra">Nombre del autor.</p>
                </div>
                <div class="detalle">
                    <strong>Año:</strong>
                    <p id="ano-obra">Año de creación.</p>
                </div>
                <div class="detalle">
                    <strong>ID de la Obra:</strong>
                    <p id="id-obra">ID único.</p>
                </div>
            </div>
        </div>
        <button class="btn-detalles btn-volver" onclick="window.history.back()">
            Volver
        </button>
    </div>

    <footer>
        <p> Museo Virtual de Arte. Alicia Ros</p>
    </footer>

    <script>
        function cargarDetallesObra(){
            const parametrosURL = new URLSearchParams(window.location.search)
            const idObra = parametrosURL.get("obraId")

            console.log("Buscando obra con ID:", idObra)

            fetch("http://localhost:4050/obras/" + idObra)
            .then(function(respuestaTextoPlano){
                console.log("Response:", respuestaTextoPlano)
                return respuestaTextoPlano.json()
            })
            .then(function(datosJSON){
                console.log("Datos completos:", datosJSON)
                console.log("Nombre:", datosJSON.nombre)
                console.log("Descripcion:", datosJSON.descripcion)
                console.log("Sala:", datosJSON.sala)
                
                document.getElementById("nombre-obra").innerText = datosJSON.nombre || "Sin nombre"
                document.getElementById("descripcion-obra").innerText = datosJSON.descripcion || "Sin descripción"
                document.getElementById("sala-obra").innerText = (datosJSON.sala && datosJSON.sala.nombre) ? datosJSON.sala.nombre : "Sin sala"
                
                // Mostrar autor si existe
                if(datosJSON.usuario && datosJSON.usuario.nombre){
                    document.getElementById("autor-obra").innerText = datosJSON.usuario.nombre + " " + (datosJSON.usuario.apellido1 || "")
                } else {
                    document.getElementById("autor-obra").innerText = "Actor desconocido"
                }
            })
            .catch(function(error){
                console.log("Error al cargar detalles:", error)
                alert("Error: " + error)
            })
        }

        cargarDetallesObra()
    </script>
</body>
</html>
