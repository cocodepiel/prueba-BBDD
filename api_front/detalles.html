<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles de la Obra</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 id="nombre-obra"></h1>
        <b>Descripción:</b> <p id="descripcion-obra"></p>
        <b>Sala:</b> <p id="sala-obra"></p>
        <b>Autor:</b> <p id="autor-obra"></p>
        <button class="btn-detalles" onclick="window.history.back()">
            Volver
        </button>
    </div>

    <script>
        function cargarDetallesObra(){
            const urlParams = new URLSearchParams(window.location.search)
            const idObra = urlParams.get("obraId")

            console.log("Buscando obra con ID:", idObra)

            fetch("http://localhost:4050/obras/" + idObra)
            .then(function(respTextoPlano){
                console.log("Response:", respTextoPlano)
                return respTextoPlano.json()
            })
            .then(function(dataJSON){
                console.log("Datos completos:", dataJSON)
                console.log("Nombre:", dataJSON.nombre)
                console.log("Descripcion:", dataJSON.descripcion)
                console.log("Sala:", dataJSON.sala)
                
                document.getElementById("nombre-obra").innerText = dataJSON.nombre || "Sin nombre"
                document.getElementById("descripcion-obra").innerText = dataJSON.descripcion || "Sin descripción"
                document.getElementById("sala-obra").innerText = (dataJSON.sala && dataJSON.sala.nombre) ? dataJSON.sala.nombre : "Sin sala"
                
                // Mostrar autor si existe
                if(dataJSON.usuario && dataJSON.usuario.nombre){
                    document.getElementById("autor-obra").innerText = dataJSON.usuario.nombre + " " + (dataJSON.usuario.apellido1 || "")
                } else {
                    document.getElementById("autor-obra").innerText = "Actor desconocido"
                }
            })
            .catch(function(err){
                console.log("Error al cargar detalles:", err)
                alert("Error: " + err)
            })
        }

        cargarDetallesObra()
    </script>
</body>
</html>
